      <param name="A_08" value="id='TEXT' matriz='sí' evaluar='una-sola-vez' columnas='10' filas='10' expresión='TEXT[0,0]=&squot;Sara hat eine Botschaft für Emil geschrieben.&squot;;TEXT[0,1]=&squot;Sara ist die Senderin, Emil der Empfänger, die Botschaft der Klartext.&squot;;TEXT[0,2]=&squot;Die Übermittlung ist unsicher.&squot;;TEXT[0,3]=&squot;Karl fängt die Botschaft ab. Er weiss, was Sara an Emil geschrieben hat.&squot;;TEXT[0,4]=&squot;Sara und Emil haben einen gemeinsamen Schlüssel.&squot;;TEXT[0,5]=&squot;Sara verschlüsselt die Botschaft vor dem Versand. Sie versendet den Kryptotext.&squot;;TEXT[0,6]=&squot;Alle erhalten die verschlüsselte Botschaft.&squot;;TEXT[0,7]=&squot;Aber nur Emil kann sie entschlüsseln.&squot;;TEXT[0,0]=&squot;&squot;;TEXT[0,1]=&squot;&squot;;TEXT[1,0]=&squot;Hallo. Ich bin Sara und habe Emil eine Botschaft geschrieben.\nIch bin die Senderin, Emil der Empfänger. Meine Botschaft heisst Klartext.&squot;;TEXT[1,1]=&squot;Unsere Übermittlung ist unsicher. Karl kann die Botschaft abfangen und lesen,\nwas ich Emil geschrieben habe. Wie kann ich dies verhindern?.&squot;;TEXT[1,2]=&squot;Ganz einfach! Ich mache mit Emil einen Geheimcode ab,\nverschlüssle meine Botschaft und versende den Kryptotext.&squot;;TEXT[1,3]=&squot;Zwar kann Karl die verschlüsselte Botschaft abfangen, aber nicht mehr lesen.\nNur Emil kann sie entschlüsseln! Dies funktioniert gut, wenn nur Emil und ich den Schlüssel kennen.&squot;;TEXT[1,4]=&squot;Wie kann ich, Sara, aber Emil einen Schlüssel schicken,\nohne dass Karl diesen abfangen und nutzen kann?&squot;;TEXT[1,5]=&squot;Nicht ich, sondern Emil erzeugt den Schlüssel und dies gleich zweifach.\nEinen Schlüssel schickt er mir. Ich benutze diesen nur zum Verschlüsseln.\nDies ist der öffentliche Schlüssel, den auch Karl kennen kann.&squot;;TEXT[1,6]=&squot;Der zweite Schlüssel behält Emil bei sich.\nDies ist der private Schlüssel, den nur er kennt und zum Entschlüsseln einsetzt.\nDies ist das Prinzip von asymmetrischen Kryptosystemen.&squot;;TEXT[1,7]=&squot;Mit asymmetrischen Kryptosystemen ist es möglich, Botschaften verschlüsselt zu verschicken,\nohne Schlüssel versenden zu müssen.\nAber wie soll dies gehen? Jetzt kommt Mathematik ins Spiel.\nDiese erlaubt es, solche Schlüsselpaare (öffentlich/privat) zu erzeugen.&squot;;TEXT[2,5]=&squot;Das Kryptosystem von Caesar war so lange sicher, wie niemand es kannte.\n\nSobald aber das Prinzip bekannt ist, kann jede Botschaft einfach entschlüsselt werden.\nMan braucht nur alle möglichen Schlüssel auszuprobieren.\n\nDaher ist es wichtig, dass es mehr Schlüssel möglich sind, als ein eifriger Kryptoanalytiker\neffizient ausprobieren kann.\n\nNach jahrhundertelanger Entwicklung der Kryptologie,\nformulierte Auguste Kerckhoffs (1835-1903) im Jahr 1883 folgendes Prinzip:\n\n\n\n\n\n\nDieses wird heute noch als gültig erachtet.&squot;;TEXT[3,0]=&squot;Karl ist in den Besitz des Schlüssels von Sara und Emil gelangt.&squot;;TEXT[3,1]=&squot;Sara hat sich daher einen neuen Schlüssel ausgedacht.&squot;;TEXT[3,2]=&squot;Weder Emil noch Karl können die verschlüsselte Botschaft entschlüsseln.\nIhre Schlüssel sind wertlos geworden.&squot;;TEXT[3,3]=&squot;Wie kann Sara ihren neuen Schlüssel Emil aber nicht Karl übermitteln?\nDies geht so nicht!&squot;;TEXT[4,0]=&squot;Das Prinzip des modularen Rechnens lässt sich mit Uhren zeigen.\nWas gibt zum Beispiel 9 Uhr plus 7 Stunden?\nFür weitere Beispiele können Sie links die Stunden der Uhr einstellen\nund die gewünschte Zeitdifferenz eingeben.&squot;;TEXT[4,1]=&squot;Das modulare Rechnen ist nicht auf 12 beschränkt, sondern lässt sich allgemein anwenden.\nGeben Sie zwei Zahlen ein, die miteinander addiert werden, sowie den Modulo-Wert.\n(Hinweis: Dieser Wert erscheint auf den Zifferblättern nicht, sondern wird durch 0 ersetzt.)&squot;;TEXT[4,2]=&squot;Das modulare Rechnen ist nicht auf Additionen beschränkt,\nauch Subtraktionen und Multiplikationen sind einfach.&squot;;TEXT[4,3]=&squot;Bisher haben wir die Rechenoperation ausgeführt und dann modulo gerechnet.\nEinfacher ist es, zuerst modulo zu rechnen. Der modulo Wert bleibt gleich!&squot;;TEXT[4,4]=&squot;Emil kann mit dem privaten Schlüssel den Kryptotext entschlüsseln.&squot;;TEXT[5,0]=&squot;Der Klartext wird zuerst in eine Zahl übersetzt. Der Klartext wird &quot;codiert&quot;.\nWir betrachten vorerst nur einen Buchstaben. Klicken Sie in den äusseren Ring,\num den Klartextbuchstaben zu ändern.&squot;;TEXT[5,1]=&squot;Emil hat einen einen Schlüssel veröffentlicht. Er besteht aus zwei Zahlen: n=33 und c=7.\nDamit kann Sara ihre Botschaft verschlüsseln. Sie rechnet Codierung^c mod n.\nDies liefert den Kryptotext, den sie an Emil schickt.&squot;;TEXT[5,2]=&squot;Der geheime Schlüssel von Emil besteht aus der Zahl d=17.\nEr berechnet damit Kryptotext^d mod n und erhält die Codierung zurück.&squot;;TEXT[5,3]=&squot;Am Schluss wird wieder entcodiert. So erhält Emil den Klartext.&squot;;TEXT[5,4]=&squot;Die Zahlen waren im Beispiel klein, um das Prinzip zu erklären.\nIn Wirklichkeit:\n\n > codiert man mehrere Buchstaben zu einer grossen Zahl und\n\n > fügt zufällige Zeichen hinzu (Auspolsterung),\n\n > n ist das Produkt zweier sehr grosser Primzahlen (mit ca. 600 Stellen)\n\n > ebenso sind c und d sehr gross (ebenfalls ca. 600 Stellen).\n\nDie erhöht zwar den Rechenaufwand, aber es macht die Verschlüsselung sicher.\nIn der Praxis ist es dann nicht mehr möglich n wieder in die Faktoren zu zerlegen.&squot;;TEXT[6,0]=&squot;Hier erfahren Sie, warum das RSA-Verfahren funktioniert. Dafür ist es wichtig die Schlüsselerzeugung\nzu verstehen. Die Schlüssel müssen nämlich gezielt gewählt werden. Im Beispiel war n=33=3*11,\ndas Produkt zweier Primzahlen. Wählen Sie selbst zwei ungerade Primzahlen.&squot;;TEXT[6,1]=&squot;Jetzt werden die Zahlen c (öffentlich) und d (geheim) bestimmt, siehe die rechte Spalte.&squot; ;TEXT[6,2]=&squot;Nun sind die Schlüssel erzeugt.\nDabei sollten die Primzahlen wirklich gross sein (ca. 600 Stellen), denn die Sicherheit besteht darin,\ndass es zu rechenaufwändig ist, das Produkt n=p·q wieder in die Faktoren p und q zu zerlegen.\n\nDer Kern des RSA-Verfahrens besteht in einem mathematischen Satz von Leonhard Euler (1707 - 1783).\nDurch die spezielle Wahl der Schlüssel garantiert der Satz, dass die Entschlüsselung\ndie Verschlüsselung wieder rückgängig macht.&squot;;TEXT[6,3]=&squot;Auch mit der Subtraktion und der Multiplikation kann modular gerechnet werden.&squot;;TEXT[6,4]=&squot;Einfacher wird es, wenn man zuerst a und b modulo [AnzStd] berechnet.&squot;;TEXT[7,0]=&squot;Die Anwendungen des RSA-Verfahrens sind vielfältig. So kommt es zum Einsatz,\nwenn wir die Bankkarte verwenden oder eine sichere Kommunikation im Internet benutzen.\nDabei wird meistens das RSA-Verfahren dazu verwendet, einen symmetrischen Schlüssel sicher\nauszutauschen und danach diesen Schlüssel für die eigentliche Kommunikation zu verwenden.\n\nKlicken Sie auf eine der zwei Kreditkarten, um die Anwendung anzusehen.&squot;;TEXT[8,0]=&squot;Bei der Authentifizierung einer Kreditkarte soll sichergestellt werden, dass es sich um eine\ngültige Kreditkarte handelt. Dabei tauschen das Lesegerät und die Bankkarte Daten aus.\n\nAuf dem Chip der Bankkarte ist frei lesbar der öffentliche Schlüssel. Wir verwenden wieder\ndas Beispiel n=33, c=13. Der geheime Schlüssel (wir verwenden d=17) ist nur für den Chip\nzugänglich und kann nicht ausgelesen werden.&squot;;TEXT[9,0]=&squot;Die digitale Signatur kommt dann zum Einsatz, wenn eine Transaktion vorgenommen werden soll.\nDie Karte kommuniziert mit dem Lesegerät und dieses mit der Bank. Das Ziel ist, sicher zu stellen,\ndass nur der Kartenbesitzer den Betrag von seinem Konto abbuchen und für den Einkauf verwenden kann.&squot;;' tipo='matriz' ">
